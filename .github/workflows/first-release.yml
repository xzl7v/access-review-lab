name: Publish Access Review Lab v1.0.0

on:
  push:
    branches: [main]
    paths: [release-notes/v1.0.0.md]

permissions:
  contents: read

concurrency:
  group: access-review-lab-v1-release
  cancel-in-progress: false

jobs:
  live-capture:
    if: github.repository == 'xzl7v/access-review-lab'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check a read-only GitHub role capture
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 github_capture.py \
            --repository "$GITHUB_REPOSITORY" \
            --account "$GITHUB_REPOSITORY_OWNER" \
            --output "$RUNNER_TEMP/access-review-owner-role.json"

  publish:
    if: github.repository == 'xzl7v/access-review-lab'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python3 -m unittest discover -s tests -v
      - run: node --test tests/review_logic.test.cjs
      - run: python3 build_demo.py --check
      - name: Publish the tested revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" --json url; then
            exit 0
          fi
          gh release create v1.0.0 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Access Review Lab v1.0.0" \
            --notes-file release-notes/v1.0.0.md
